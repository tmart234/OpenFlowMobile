name: iOS CI

on:
  push:
    branches: [dev, main]
    paths:
      - 'OpenFlowiOS/**'
      - 'OpenFlowiOSTests/**'
      - 'OpenFlowMobile.xcodeproj/**'
      - 'data/station_registry.json'
      - '.github/workflows/ios-ci.yml'
  pull_request:
    paths:
      - 'OpenFlowiOS/**'
      - 'OpenFlowiOSTests/**'
      - 'OpenFlowMobile.xcodeproj/**'
      - 'data/station_registry.json'
      - '.github/workflows/ios-ci.yml'
  workflow_dispatch:

jobs:
  test:
    name: Build + Test (iOS Simulator)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Show build environment
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project OpenFlowMobile.xcodeproj \
            -scheme OpenFlowMobile \
            -resolvePackageDependencies

      - name: Test on iOS Simulator
        # `test` builds the app + the OpenFlowiOSTests bundle and runs the
        # latter's XCTest cases. A simulator destination is required (unit
        # tests can't run against a `generic` device).
        run: |
          set -o pipefail
          xcodebuild \
            -project OpenFlowMobile.xcodeproj \
            -scheme OpenFlowMobile \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test
