name: Update station registry

# Resolves each supported site's (lat, lon, HUC8, SNOTEL triplets, GHCND station)
# and opens a PR if data/station_registry.json changed. Apps bundle this file.
on:
  workflow_dispatch:
  schedule:
    # Quarterly: 1st of Jan/Apr/Jul/Oct at 07:00 UTC.
    - cron: '0 7 1 1,4,7,10 *'

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Build registry
        run: python scripts/build_registry.py

      - name: Diff
        id: diff
        run: |
          if git diff --quiet -- data/station_registry.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff -- data/station_registry.json | head -200
          fi

      - name: Open PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/registry-update
          commit-message: 'chore(registry): refresh station_registry.json'
          title: 'chore(registry): refresh station_registry.json'
          body: |
            Automated registry refresh from `scripts/build_registry.py`.

            Re-resolved each supported site's (lat, lon, HUC8, SNOTEL
            triplets, closest GHCND station with recent TMIN/TMAX/PRCP).

            Triggered by ${{ github.event_name }}.
          add-paths: data/station_registry.json
